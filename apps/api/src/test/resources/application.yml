server:
  port: 8083
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # EmailServiceImpl 构造依赖 JavaMailSender；Spring Boot 只有在 spring.mail.host 存在时
  # 才会创建该 bean。本文件覆盖了 src/main 的同名配置，缺这一项会让裸 @SpringBootTest
  # 的 contextLoads 直接启动失败。给一个不会被使用的本地地址即可——mail.enabled 仍为
  # false，MailAvailability 判定为不可用，测试里不会真的发信。
  mail:
    host: localhost
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000

upload:
  path: ./test-uploads
  url-prefix: /uploads

logging:
  level:
    com.simplecard: DEBUG

coordination:
  enabled: false

payment-inbox:
  worker-enabled: false

product-guard:
  enabled: false

api-rate-limit:
  enabled: false
